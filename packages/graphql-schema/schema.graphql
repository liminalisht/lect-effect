"""input for creating an item"""
input CreateItemInput {
  """item description (nullable & optional)"""
  description: String

  """item pack size"""
  pack_size: Int!
}

input CreateProductWithItemsProductInput {
  """product description (nullable & optional)"""
  description: String
}

type GetProductWithItems {
  items: [Item!]!

  """product"""
  product: Product!
}

"""response to hello query"""
type HelloResponse {
  """greeting message"""
  greeting: String!
}

"""item"""
type Item {
  """item description (nullable)"""
  description: String

  """item identifier"""
  id: Int!

  """item pack size"""
  pack_size: Int!

  """product for this item"""
  product: Product
}

type Mutation {
  """create a new item"""
  createItem(
    """item description (nullable & optional)"""
    description: String

    """item pack size"""
    pack_size: Int!
  ): Item!

  """create product"""
  createProduct(
    """product description (nullable & optional)"""
    description: String
  ): Product!

  """create product and its items"""
  createProductWithItems(items: [CreateItemInput!]!, product: CreateProductWithItemsProductInput!): GetProductWithItems!
}

"""product"""
type Product {
  """product description (nullable)"""
  description: String

  """product identifier"""
  id: Int!

  """items for this product"""
  items: [Item!]!
}

type Query {
  """get item by id"""
  getItem(
    """item identifier"""
    id: Int!
  ): Item

  """get product by id"""
  getProduct(
    """product identifier"""
    id: Int!
  ): Product

  """get product and its items by id"""
  getProductWithItems(
    """product identifier"""
    id: Int!
  ): GetProductWithItems

  """greet a user by name"""
  greet(
    """optional name to greet"""
    name: String
  ): HelloResponse!

  """list all items"""
  listItems: [Item!]!

  """list all products"""
  listProducts: [Product!]!
}
